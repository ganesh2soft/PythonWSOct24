<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="250" fill="#ffffff"/>

  <!-- Title with date -->
  <text x="80" y="38" font-size="22" font-weight="700" fill="#111">Nifty Sentiment Scale</text>
  <text x="920" y="38" font-size="18" fill="#444" text-anchor="end">25 September 2026</text>

  <!-- Scale rectangle -->
  <rect x="80" y="60" width="840" height="60" fill="none" stroke="#111" stroke-width="3"/>

  <!-- Division lines every 5 units -->
  <g stroke="#111" stroke-width="1.5">
    <line x1="220" y1="60" x2="220" y2="120"/>
    <line x1="360" y1="60" x2="360" y2="120"/>
    <line x1="500" y1="60" x2="500" y2="120"/>
    <line x1="640" y1="60" x2="640" y2="120"/>
    <line x1="780" y1="60" x2="780" y2="120"/>
  </g>

  <!-- Tick marks below the rectangle -->
  <g stroke="#111" stroke-width="2">
    <line x1="80"  y1="120" x2="80"  y2="132"/>
    <line x1="220" y1="120" x2="220" y2="132"/>
    <line x1="360" y1="120" x2="360" y2="132"/>
    <line x1="500" y1="120" x2="500" y2="132"/>
    <line x1="640" y1="120" x2="640" y2="132"/>
    <line x1="780" y1="120" x2="780" y2="132"/>
    <line x1="920" y1="120" x2="920" y2="132"/>
  </g>

  <!-- Values -->
  <g font-size="26" font-weight="600" fill="#111" text-anchor="middle">
    <text x="80"  y="162">-15</text>
    <text x="220" y="162">-10</text>
    <text x="360" y="162">-5</text>
    <text x="500" y="162">0</text>
    <text x="640" y="162">5</text>
    <text x="780" y="162">10</text>
    <text x="920" y="162">15</text>
  </g>

  <!-- Descriptions -->
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="80"  y="188">Strong</text><text x="80"  y="207">Bearish</text>
    <text x="220" y="188">Bearish</text>
    <text x="360" y="188">Bearish to</text><text x="360" y="207">Neutral</text>
    <text x="500" y="188">Neutral</text>
    <text x="640" y="188">Neutral to</text><text x="640" y="207">Bullish</text>
    <text x="780" y="188">Bullish</text>
    <text x="920" y="188">Strong</text><text x="920" y="207">Bullish</text>
  </g>
</svg>
